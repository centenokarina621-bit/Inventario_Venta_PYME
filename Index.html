<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Control de inventario y ventas</title>
<style>
:root{--bg:#f3f5f7;--card:#fff;--ink:#1c2630;--mute:#66727f;--line:#dde3e8;--acc:#0f6b73;--acc-d:#0a4f55;--warn-bg:#fff1d6;--warn:#8a5a00;--bad-bg:#fde2e0;--bad:#a1271d;--ok-bg:#dff3e6;--ok:#1d6b3a}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,"Segoe UI",Roboto,sans-serif}
header{background:var(--acc-d);color:#fff;padding:14px 20px;display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
header h1{margin:0;font-size:1.15rem;font-weight:650}
nav{display:flex;gap:4px}
nav button{background:transparent;color:#cfe5e7;border:0;padding:8px 14px;border-radius:6px;font:inherit;cursor:pointer}
nav button.on{background:#fff;color:var(--acc-d);font-weight:600}
main{max-width:980px;margin:20px auto;padding:0 16px}
section{display:none}section.on{display:block}
.card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:16px;margin-bottom:16px}
h2{margin:0 0 12px;font-size:1.05rem}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:end}
label{display:flex;flex-direction:column;font-size:.82rem;color:var(--mute);gap:3px}
input,select{font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:6px;background:#fff;color:var(--ink);min-width:0}
input:focus-visible,select:focus-visible,button:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
.btn{background:var(--acc);color:#fff;border:0;padding:9px 16px;border-radius:6px;font:inherit;font-weight:600;cursor:pointer}
.btn:hover{background:var(--acc-d)}
.btn.sec{background:#e8edf0;color:var(--ink)}.btn.sec:hover{background:#dbe2e7}
.btn.sm{padding:5px 10px;font-size:.85rem}
.tbl{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:9px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:.8rem;color:var(--mute);font-weight:600}
td.n,th.n{text-align:right}
.tag{display:inline-block;padding:2px 9px;border-radius:99px;font-size:.78rem;font-weight:600}
.t-ok{background:var(--ok-bg);color:var(--ok)}.t-low{background:var(--warn-bg);color:var(--warn)}.t-out{background:var(--bad-bg);color:var(--bad)}
tr.low td:first-child{box-shadow:inset 3px 0 var(--warn)}tr.out td:first-child{box-shadow:inset 3px 0 var(--bad)}
.alert{padding:10px 14px;border-radius:6px;margin-bottom:16px;background:var(--warn-bg);color:var(--warn);display:none}
.alert.show{display:block}
.empty{color:var(--mute);padding:14px 0}
.total{font-size:1.3rem;font-weight:700;text-align:right;margin:12px 0}
#msg{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:6px;display:none;max-width:90%}
#msg.err{background:var(--bad)}
@media(max-width:600px){input,select{width:100%}.row label{flex:1 1 130px}}
</style>
</head>
<body>
<header>
  <h1>Control de inventario y ventas</h1>
  <nav>
    <button data-tab="productos" class="on">Productos</button>
    <button data-tab="venta">Nueva venta</button>
    <button data-tab="historial">Historial</button>
  </nav>
</header>
<main>
  <div id="alerta" class="alert" role="status"></div>

  <section id="productos" class="on">
    <div class="card">
      <h2 id="form-titulo">Agregar producto</h2>
      <div class="row">
        <input type="hidden" id="p-id">
        <label>Código<input id="p-codigo" maxlength="20"></label>
        <label style="flex:2 1 200px">Nombre<input id="p-nombre" maxlength="80"></label>
        <label>Precio<input id="p-precio" type="number" min="0" step="0.01"></label>
        <label>Stock actual<input id="p-stock" type="number" min="0" step="1"></label>
        <label>Stock mínimo<input id="p-min" type="number" min="0" step="1" value="5"></label>
        <button class="btn" id="p-guardar">Guardar producto</button>
        <button class="btn sec" id="p-cancelar" style="display:none">Cancelar</button>
      </div>
    </div>
    <div class="card">
      <div class="row" style="justify-content:space-between;margin-bottom:8px">
        <h2 style="margin:0">Inventario</h2>
        <label>Buscar<input id="buscar" placeholder="Nombre o código"></label>
      </div>
      <div class="tbl"><table>
        <thead><tr><th>Código</th><th>Producto</th><th class="n">Precio</th><th class="n">Stock</th><th>Estado</th><th></th></tr></thead>
        <tbody id="lista"></tbody>
      </table></div>
    </div>
  </section>

  <section id="venta">
    <div class="card">
      <h2>Registrar venta</h2>
      <div class="row">
        <label style="flex:2 1 240px">Producto<select id="v-prod"></select></label>
        <label>Cantidad<input id="v-cant" type="number" min="1" step="1" value="1"></label>
        <button class="btn sec" id="v-add">Agregar a la venta</button>
      </div>
    </div>
    <div class="card">
      <h2>Detalle de la venta</h2>
      <div class="tbl"><table>
        <thead><tr><th>Producto</th><th class="n">Cant.</th><th class="n">Precio</th><th class="n">Subtotal</th><th></th></tr></thead>
        <tbody id="carrito"></tbody>
      </table></div>
      <div class="total" id="v-total">Total: 0.00</div>
      <div style="text-align:right"><button class="btn" id="v-confirmar">Confirmar venta</button></div>
    </div>
  </section>

  <section id="historial">
    <div class="card">
      <h2>Ventas registradas</h2>
      <div class="tbl"><table>
        <thead><tr><th>N.º</th><th>Fecha</th><th>Detalle</th><th class="n">Total</th></tr></thead>
        <tbody id="hist"></tbody>
      </table></div>
    </div>
  </section>
</main>
<div id="msg"></div>

<script>
// ---------- Capa de datos (localStorage). Para pasar a un servidor, solo se reemplaza esta parte. ----------
const KEY = "inventario_pyme_v1";
const vacio = () => ({ productos: [], ventas: [], detalle_venta: [], seq: { p: 0, v: 0, d: 0 } });
function cargar() {
  try { return JSON.parse(localStorage.getItem(KEY)) || vacio(); } catch (e) { return vacio(); }
}
function guardar() {
  try { localStorage.setItem(KEY, JSON.stringify(db)); } catch (e) { aviso("No se pudo guardar en este navegador", true); }
}
let db = cargar();
let carrito = [];

// ---------- Utilidades ----------
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const money = n => Number(n).toFixed(2);
function aviso(t, err) {
  const m = $("msg"); m.textContent = t; m.className = err ? "err" : ""; m.style.display = "block";
  clearTimeout(aviso.t); aviso.t = setTimeout(() => m.style.display = "none", 2600);
}
function estado(p) {
  if (p.stock <= 0) return { c: "out", t: "Agotado" };
  if (p.stock <= p.stock_minimo) return { c: "low", t: "Stock bajo" };
  return { c: "ok", t: "Disponible" };
}

// ---------- Navegación ----------
document.querySelectorAll("nav button").forEach(b => b.onclick = () => {
  document.querySelectorAll("nav button").forEach(x => x.classList.toggle("on", x === b));
  document.querySelectorAll("section").forEach(s => s.classList.toggle("on", s.id === b.dataset.tab));
  render();
});

// ---------- Productos ----------
function limpiarForm() {
  ["p-id", "p-codigo", "p-nombre", "p-precio", "p-stock"].forEach(i => $(i).value = "");
  $("p-min").value = 5;
  $("form-titulo").textContent = "Agregar producto";
  $("p-cancelar").style.display = "none";
}
$("p-cancelar").onclick = limpiarForm;
$("p-guardar").onclick = () => {
  const id = Number($("p-id").value) || 0;
  const codigo = $("p-codigo").value.trim();
  const nombre = $("p-nombre").value.trim();
  const precio = parseFloat($("p-precio").value);
  const stock = parseInt($("p-stock").value, 10);
  const min = parseInt($("p-min").value, 10);
  if (!codigo || !nombre) return aviso("Escribe el código y el nombre del producto", true);
  if (!(precio >= 0)) return aviso("El precio debe ser un número igual o mayor que 0", true);
  if (!(stock >= 0) || !(min >= 0)) return aviso("El stock debe ser un número igual o mayor que 0", true);
  if (db.productos.some(p => p.codigo.toLowerCase() === codigo.toLowerCase() && p.id !== id))
    return aviso("Ya existe un producto con ese código", true);
  if (id) {
    Object.assign(db.productos.find(p => p.id === id), { codigo, nombre, precio, stock, stock_minimo: min });
    aviso("Producto actualizado");
  } else {
    db.productos.push({ id: ++db.seq.p, codigo, nombre, precio, stock, stock_minimo: min });
    aviso("Producto agregado");
  }
  guardar(); limpiarForm(); render();
};
function editar(id) {
  const p = db.productos.find(x => x.id === id);
  $("p-id").value = p.id; $("p-codigo").value = p.codigo; $("p-nombre").value = p.nombre;
  $("p-precio").value = p.precio; $("p-stock").value = p.stock; $("p-min").value = p.stock_minimo;
  $("form-titulo").textContent = "Editar producto";
  $("p-cancelar").style.display = "";
  window.scrollTo({ top: 0, behavior: "smooth" });
}
$("buscar").oninput = renderProductos;
function renderProductos() {
  const q = $("buscar").value.trim().toLowerCase();
  const filas = db.productos.filter(p => !q || p.nombre.toLowerCase().includes(q) || p.codigo.toLowerCase().includes(q));
  $("lista").innerHTML = filas.length ? filas.map(p => {
    const e = estado(p);
    return `<tr class="${e.c === "ok" ? "" : e.c}"><td>${esc(p.codigo)}</td><td>${esc(p.nombre)}</td>
      <td class="n">${money(p.precio)}</td><td class="n">${p.stock}</td>
      <td><span class="tag t-${e.c}">${e.t}</span></td>
      <td><button class="btn sec sm" onclick="editar(${p.id})">Editar</button></td></tr>`;
  }).join("") : `<tr><td colspan="6" class="empty">${db.productos.length ? "Ningún producto coincide con la búsqueda." : "Aún no hay productos. Agrega el primero con el formulario de arriba."}</td></tr>`;
}

// ---------- Alerta global ----------
function renderAlerta() {
  const out = db.productos.filter(p => p.stock <= 0).length;
  const low = db.productos.filter(p => p.stock > 0 && p.stock <= p.stock_minimo).length;
  const a = $("alerta");
  const partes = [];
  if (out) partes.push(`${out} producto(s) agotado(s)`);
  if (low) partes.push(`${low} con stock bajo`);
  a.textContent = partes.length ? "Atención: " + partes.join(" y ") + "." : "";
  a.classList.toggle("show", partes.length > 0);
}

// ---------- Ventas ----------
function renderSelect() {
  const disp = db.productos.filter(p => p.stock > 0);
  const previo = $("v-prod").value;
  $("v-prod").innerHTML = disp.length
    ? disp.map(p => `<option value="${p.id}">${esc(p.codigo)} · ${esc(p.nombre)} (stock ${p.stock}) — ${money(p.precio)}</option>`).join("")
    : `<option value="">No hay productos con stock</option>`;
  if (previo) $("v-prod").value = previo;
}
$("v-add").onclick = () => {
  const p = db.productos.find(x => x.id === Number($("v-prod").value));
  const cant = parseInt($("v-cant").value, 10);
  if (!p) return aviso("Selecciona un producto con stock", true);
  if (!(cant >= 1)) return aviso("La cantidad debe ser al menos 1", true);
  const linea = carrito.find(l => l.producto_id === p.id);
  const total = (linea ? linea.cantidad : 0) + cant;
  if (total > p.stock) return aviso(`Solo quedan ${p.stock} unidades de ${p.nombre}`, true);
  if (linea) linea.cantidad = total;
  else carrito.push({ producto_id: p.id, cantidad: cant });
  $("v-cant").value = 1; renderCarrito();
};
function quitar(i) { carrito.splice(i, 1); renderCarrito(); }
function totalCarrito() {
  return carrito.reduce((s, l) => s + l.cantidad * db.productos.find(p => p.id === l.producto_id).precio, 0);
}
function renderCarrito() {
  $("carrito").innerHTML = carrito.length ? carrito.map((l, i) => {
    const p = db.productos.find(x => x.id === l.producto_id);
    return `<tr><td>${esc(p.nombre)}</td><td class="n">${l.cantidad}</td><td class="n">${money(p.precio)}</td>
      <td class="n">${money(l.cantidad * p.precio)}</td><td><button class="btn sec sm" onclick="quitar(${i})">Quitar</button></td></tr>`;
  }).join("") : `<tr><td colspan="5" class="empty">Agrega productos para armar la venta.</td></tr>`;
  $("v-total").textContent = "Total: " + money(totalCarrito());
}
$("v-confirmar").onclick = () => {
  if (!carrito.length) return aviso("Agrega al menos un producto a la venta", true);
  // Validar stock otra vez antes de descontar
  for (const l of carrito) {
    const p = db.productos.find(x => x.id === l.producto_id);
    if (l.cantidad > p.stock) return aviso(`Stock insuficiente de ${p.nombre}`, true);
  }
  const venta = { id: ++db.seq.v, fecha: new Date().toISOString(), total: totalCarrito() };
  db.ventas.push(venta);
  carrito.forEach(l => {
    const p = db.productos.find(x => x.id === l.producto_id);
    db.detalle_venta.push({ id: ++db.seq.d, venta_id: venta.id, producto_id: p.id, cantidad: l.cantidad, precio_unitario: p.precio, subtotal: l.cantidad * p.precio });
    p.stock -= l.cantidad;
  });
  guardar(); carrito = [];
  aviso(`Venta N.º ${venta.id} registrada`); render();
};

// ---------- Historial ----------
function renderHistorial() {
  $("hist").innerHTML = db.ventas.length ? [...db.ventas].reverse().map(v => {
    const items = db.detalle_venta.filter(d => d.venta_id === v.id).map(d => {
      const p = db.productos.find(x => x.id === d.producto_id);
      return `${esc(p ? p.nombre : "Producto eliminado")} ×${d.cantidad}`;
    }).join(", ");
    return `<tr><td>${v.id}</td><td>${new Date(v.fecha).toLocaleString("es")}</td><td style="white-space:normal">${items}</td><td class="n">${money(v.total)}</td></tr>`;
  }).join("") : `<tr><td colspan="4" class="empty">Todavía no hay ventas registradas.</td></tr>`;
}

function render() { renderAlerta(); renderProductos(); renderSelect(); renderCarrito(); renderHistorial(); }
render();
</script>
</body>
</html>
